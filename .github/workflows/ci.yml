name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on a PR branch (a new push obsoletes the old one),
# but never cancel a push-to-main run: those are the record that the merged
# commit passed, and a cancellation reads as a red/skipped check even though
# every step would have passed. Gating on the event keeps PR feedback fast
# while letting main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test
